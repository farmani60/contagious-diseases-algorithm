[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contagious-diseases-algorithm"
version = "1.0.0"
description = "Python implementation of the Contagious Diseases Algorithm (CDA), an evolutionary optimiser inspired by epidemic outbreaks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["optimization", "evolutionary algorithm", "metaheuristic", "benchmark"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = ["scipy>=1.10", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["cda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
